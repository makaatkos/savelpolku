  <script>
    /* Versiotarkistus: jos selain näyttää vanhaa sivua välimuistista, uusin versio ladataan kerran automaattisesti.
       Uusi osoite (?v=) ohittaa välimuistin varmasti. */
    window.SP_VERSION = 41;
    (function () {
      function fresh(v) { location.replace(location.pathname + '?v=' + v + '#/'); }
      window.SP_FRESH = fresh;
      try {
        fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
          if (j && j.v && j.v !== window.SP_VERSION) {
            var k = 'sp-reload-' + j.v;
            if (!sessionStorage.getItem(k)) { sessionStorage.setItem(k, '1'); fresh(j.v); }
          }
        }).catch(function () { });
      } catch (e) { }
      /* Varanäkymä: jos sovellus ei käynnisty, tyhjän ruudun sijaan näytetään ilmoitus ja uudelleenlatausnappi */
      setTimeout(function () {
        if (window.SP_READY) return;
        var app = document.getElementById('app');
        if (app) app.innerHTML = '<div class="bootfail"><h1>Sävelpolku ei käynnistynyt</h1><p>Lataa sivu uudelleen. Edistymisesi on tallessa.</p><button class="btn primary big" onclick="window.SP_FRESH(Date.now())">Lataa uudelleen</button></div>';
      }, 6000);
    })();
  </script>
